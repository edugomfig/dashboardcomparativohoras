<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Portfólio de Horas</title>
<meta name="color-scheme" content="light">
<style>
  :root{
    color-scheme: light;
    --page:        #f7f8f7;
    --surface:     #ffffff;
    --surface-2:   #f1f2f0;
    --text-1:      #10120f;
    --text-2:      #52564f;
    --text-mut:    #8a8d85;
    --border:      rgba(16,18,15,0.10);
    --border-2:    rgba(16,18,15,0.16);
    --accent:      #2a5fd6;
    --accent-ink:  #1c3fa0;
    --accent-wash: rgba(42,95,214,0.12);
    --accent-wash-2:rgba(42,95,214,0.22);
    --good:        #0ca30c;
    --warning:     #b5850a;
    --critical:    #c23a2e;
    --neutral-bar: #b9bcb3;
    --pie-rest:    #dfe1dc;
    --est-solic:   #7b86a3;
    --cat-1: #2a5fd6; --cat-2: #d97a34; --cat-3: #1baf7a; --cat-4: #b5850a; --cat-5: #c2568a;
    --header-bg:   #14213d;
    --header-bg-2: #1b2d52;
    --header-ink:  #ffffff;
    --header-ink-mut: rgba(255,255,255,0.66);
    --shadow: 0 1px 2px rgba(16,18,15,0.04), 0 8px 24px -12px rgba(16,18,15,0.14);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; }
  body{
    background: var(--page);
    color: var(--text-1);
    font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3, .num-hero, .stat-value{
    font-family: "Sora", "Public Sans", system-ui, sans-serif;
  }
  .tabular{ font-variant-numeric: tabular-nums; }
  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 20px;
  }
  
  .portfolio-nav{
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 20px;
    display:flex;
    align-items:center;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border-2) transparent;
  }
  .nav-inner::-webkit-scrollbar{ height: 6px; }
  .nav-inner::-webkit-scrollbar-track{ background: transparent; }
  .nav-inner::-webkit-scrollbar-thumb{ background: var(--border-2); border-radius: 3px; }
  .nav-btn{
    appearance:none; border:none; background:transparent; cursor:pointer;
    font-family: inherit; font-size: 13.5px; font-weight: 600;
    color: var(--text-2);
    padding: 12px 14px;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    flex: none;
  }
  .nav-btn:hover{ color: var(--text-1); }
  .nav-btn.active{ color: var(--accent-ink); border-bottom-color: var(--accent); }
  
  .portfolio-header{
    background: linear-gradient(155deg, var(--header-bg-2), var(--header-bg) 70%);
    color: var(--header-ink);
  }
  .header-inner{
    max-width: 1180px;
    margin: 0 auto;
    padding: 16px 20px 14px;
    display:flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 8px 24px;
    flex-wrap: wrap;
  }
  .header-titleblock{ min-width: 260px; flex: 1 1 380px; }
  .portfolio-header .eyebrow{
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--header-ink-mut);
    margin: 0 0 3px;
  }
  .portfolio-header h1{
    font-size: clamp(19px, 2.4vw, 24px);
    font-weight: 700;
    line-height: 1.2;
    margin: 0 0 3px;
    color: var(--header-ink);
    text-wrap: balance;
  }
  .portfolio-header .lede{
    font-size: 12.5px;
    line-height: 1.4;
    margin: 0;
    color: var(--header-ink-mut);
    max-width: 760px;
  }
  .header-meta{
    display:flex;
    gap: 28px;
    flex-wrap: wrap;
    flex: 0 0 auto;
  }
  .meta-block{
    display:flex;
    flex-direction:column;
    gap: 2px;
    min-width: 100px;
  }
  .meta-label{
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--header-ink-mut);
  }
  .meta-value{
    font-size: 14px;
    font-weight: 600;
    color: var(--header-ink);
  }
  @media (max-width: 760px){
    .portfolio-header .header-inner{ padding: 14px 20px 12px; }
    .header-meta{ gap: 20px; }
  }
  
  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
  
  .summary-grid{ margin-top: 22px; display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
  .sum-card{ padding: 18px 22px 20px; min-width: 0; }
  .sum-card.span-2{ grid-column: 1 / -1; }
  .sum-head{ display:flex; align-items:baseline; justify-content:space-between; gap: 8px 16px; flex-wrap:wrap; margin-bottom: 14px; }
  .sum-title{ font-family:"Sora","Public Sans",system-ui,sans-serif; font-size: 15px; font-weight: 700; margin:0; }
  .sum-hint{ font-size: 12px; color: var(--text-mut); }
  .sum-sub{ font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-mut); margin: 0 0 8px; }
  .num-hero{ font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
  .stat-value{ font-size: 24px; font-weight: 700; line-height: 1.1; }
  .stat-label{ font-size: 12px; color: var(--text-mut); font-weight: 600; }
  .stat-sub{ font-size: 12px; color: var(--text-2); }
  .hrs-grid{ display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 28px; }
  .hrs-right{ padding-left: 28px; border-left: 1px solid var(--border); min-width:0; }
  .hrs-stats{ display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-bottom: 16px; }
  .hrs-stat{ display:flex; flex-direction:column; gap: 3px; min-width:0; }
  .st-txt-good{ color: var(--good); } .st-txt-warning{ color: var(--warning); } .st-txt-critical{ color: var(--critical); } .st-txt-neutral{ color: var(--text-2); }
  .hbar-row{ display:grid; grid-template-columns: 92px 1fr 64px; align-items:center; gap: 10px; padding: 5px 0; }
  .hbar-label{ font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .hbar-track{ position:relative; height: 16px; background: var(--surface-2); border-radius: 5px; overflow:hidden; display:flex; }
  .hbar-seg{ height:100%; min-width: 3px; }
  .hbar-val{ font-size: 13px; font-weight: 700; text-align:right; white-space:nowrap; }
  .seg-noest{ background: repeating-linear-gradient(135deg, var(--neutral-bar) 0 5px, #d3d5ce 5px 10px); }
  .mini-legend{ display:flex; gap: 6px 16px; flex-wrap:wrap; font-size: 11.5px; color: var(--text-2); margin-top: 10px; }
  .mini-legend span{ display:inline-flex; align-items:center; gap:6px; }
  .sq{ width:10px; height:10px; border-radius:3px; display:inline-block; flex:none; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
  .note-sm{ font-size: 12px; color: var(--text-mut); margin-top: 10px; line-height: 1.45; }
  .div-row{ display:grid; grid-template-columns: minmax(0,210px) 1fr 58px; align-items:center; gap: 10px; padding: 5px 0; cursor:pointer; border-radius: 6px; }
  .div-row:hover .div-name{ color: var(--accent-ink); }
  .div-name{ font-size: 12.5px; font-weight: 600; color: var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .div-track{ position:relative; height: 12px; }
  .div-track::before{ content:""; position:absolute; left:50%; top:-3px; bottom:-3px; width:1px; background: var(--border-2); }
  .div-fill{ position:absolute; top:0; bottom:0; min-width: 2px; }
  .div-fill.over{ left:50%; border-radius: 0 4px 4px 0; }
  .div-fill.under{ right:50%; border-radius: 4px 0 0 4px; }
  .div-na{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size: 11px; color: var(--text-mut); }
  .div-val{ font-size: 12.5px; font-weight: 700; text-align:right; white-space:nowrap; }
  .div-axis{ display:grid; grid-template-columns: minmax(0,210px) 1fr 58px; gap: 10px; font-size: 10.5px; color: var(--text-mut); margin-top: 4px; }
  .div-axis div{ display:flex; justify-content:space-between; }
  .sum-big{ display:flex; align-items:baseline; gap: 10px; flex-wrap:wrap; margin-bottom: 14px; }
  .sum-big-label{ font-size: 12.5px; color: var(--text-2); }
  .set-row{ display:grid; grid-template-columns: 150px 1fr 118px; align-items:center; gap: 10px; padding: 7px 0; }
  .set-row + .set-row{ border-top: 1px solid var(--border); }
  .set-name{ display:flex; align-items:center; gap: 8px; font-size: 13px; font-weight: 600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .set-bars{ display:flex; flex-direction:column; gap: 4px; }
  .set-track{ height: 9px; background: var(--surface-2); border-radius: 4px; overflow:hidden; }
  .set-track > div{ height:100%; border-radius: 4px; min-width: 3px; }
  .set-val{ text-align:right; white-space:nowrap; }
  .set-val b{ display:block; font-size: 13px; }
  .set-val span{ display:block; font-size: 11.5px; color: var(--text-mut); margin-top: 1px; }
  .rw-top{ display:grid; grid-template-columns: 104px 1fr; gap: 18px; align-items:center; margin-bottom: 12px; }
  .rw-pie{ width: 104px; height: 104px; display:block; }
  .rw-num{ font-family:"Sora","Public Sans",system-ui,sans-serif; font-size: 30px; font-weight: 700; color: var(--critical); line-height:1.1; }
  .rw-txt{ font-size: 12.5px; color: var(--text-2); line-height: 1.45; margin-top: 4px; }
  .rw-txt b{ color: var(--text-1); }
  .rwp-row{ display:grid; grid-template-columns: minmax(0,1fr) 110px 92px; align-items:center; gap: 10px; padding: 6px 0; cursor:pointer; border-top: 1px solid var(--border); }
  .rwp-row:hover .div-name{ color: var(--accent-ink); }
  .rwp-track{ height: 9px; background: var(--surface-2); border-radius: 4px; overflow:hidden; }
  .rwp-track > div{ height:100%; background: var(--critical); border-radius: 4px; min-width: 3px; }
  .rwp-val{ font-size: 12.5px; font-weight: 700; color: var(--critical); text-align:right; white-space:nowrap; }
  .rwp-val span{ color: var(--text-mut); font-weight: 500; }
  @media (max-width: 900px){
    .summary-grid{ grid-template-columns: 1fr; }
    .hrs-grid{ grid-template-columns: 1fr; }
    .hrs-right{ padding-left: 0; border-left: none; border-top: 1px solid var(--border); padding-top: 16px; }
  }
  @media (max-width: 560px){
    .hrs-stats{ grid-template-columns: repeat(2, minmax(0,1fr)); }
    .num-hero{ font-size: 26px; }
    .div-row{ grid-template-columns: 1fr 52px; row-gap: 3px; }
    .div-row .div-name{ grid-column: 1 / -1; }
    .div-axis{ grid-template-columns: 0 1fr 52px; }
    .set-row{ grid-template-columns: 1fr 112px; }
    .set-row .set-bars{ grid-column: 1 / -1; grid-row: 2; }
    .rwp-row{ grid-template-columns: minmax(0,1fr) 88px; }
    .rwp-row .rwp-track{ display:none; }
    .rw-top{ grid-template-columns: 84px 1fr; }
    .rw-pie{ width: 84px; height: 84px; }
  }
  
  section.block{ margin-top: 34px; padding-bottom: 8px; }
  .block-head{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .block-head h2{
    font-size: 17px;
    font-weight: 700;
    margin: 0;
  }
  .block-head .hint{
    font-size: 12.5px;
    color: var(--text-mut);
  }
  
  .status-badge{
    display:inline-flex;
    align-items:center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status-badge.st-good{ color: var(--good); background: rgba(12,163,12,0.12); }
  .status-badge.st-warning{ color: var(--warning); background: rgba(181,133,10,0.14); }
  .status-badge.st-critical{ color: var(--critical); background: rgba(194,58,46,0.12); }
  .status-badge.st-neutral{ color: var(--text-2); background: var(--surface-2); }
  
  .cards-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }
  .project-card{
    padding: 0;
    overflow: hidden;
    display:flex;
    flex-direction:column;
    cursor: pointer;
  }
  .project-card:hover{ border-color: var(--border-2); }
  .pc-header{
    background: var(--header-bg);
    color: var(--header-ink);
    padding: 14px 22px;
  }
  .pc-header-title{
    font-size: 15px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--header-ink);
  }
  .pc-body{
    padding: 16px 22px 20px;
    display:flex;
    flex-direction:column;
    gap: 14px;
  }
  .pc-status-row{ display:flex; }
  .pc-bars{ display:flex; flex-direction:column; gap: 6px; }
  .pc-row{
    display:grid;
    grid-template-columns: 72px 1fr 60px;
    align-items:center;
    gap: 10px;
  }
  .pc-row-label{ font-size: 11.5px; color: var(--text-mut); font-weight:600; }
  .pc-track{
    position: relative;
    height: 8px;
    background: var(--surface-2);
    border-radius: 4px;
    overflow: hidden;
  }
  .pc-fill{
    position:absolute; left:0; top:0; bottom:0;
    border-radius: 4px;
    min-width: 3px;
  }
  .pc-val{ font-size: 12px; text-align:right; color: var(--text-2); font-weight:600; white-space: nowrap; }
  .pc-note{ font-size: 12px; color: var(--text-mut); display:flex; flex-direction:column; gap: 2px; }
  .pc-note .na{ font-style: italic; }
  .pc-foot{ display:grid; grid-template-columns: minmax(0,1fr) auto; align-items:center; gap: 2px 10px; padding-top: 8px; border-top: 1px solid var(--border); }
  .pc-meta{ font-size: 12px; color: var(--text-mut); line-height: 1.35; min-width: 0; }
  .pc-atend{ grid-column: 1 / -1; display:flex; flex-direction:column; gap: 2px; }
  .pc-atend .na{ font-style: italic; }
  .pc-cta{ grid-column: 2; }
  .pc-cta{
    appearance:none; border:none; cursor:pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700;
    color: var(--accent-ink);
    background: var(--accent-wash);
    padding: 7px 12px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .pc-cta:hover{ background: var(--accent-wash-2); }
  
  .project-view{ display:none; }
  .project-view-bar{
    max-width: 1180px;
    margin: 0 auto;
    padding: 14px 20px 0;
  }
  .back-btn{
    appearance:none; border:1px solid var(--border-2); background: var(--surface);
    cursor:pointer;
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--text-2);
    padding: 7px 14px;
    border-radius: 9px;
  }
  .back-btn:hover{ color: var(--text-1); border-color: var(--border-2); background: var(--surface-2); }
  
  .filter-bar{ margin-top: 18px; padding: 12px 18px; display:flex; align-items:center; gap: 10px 18px; flex-wrap: wrap; position: relative; z-index: 30; }
  .pc-filters{ display:flex; align-items:center; gap: 8px 18px; flex-wrap: wrap; }
  .pc-filter{ display:inline-flex; align-items:center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .pc-filter select, .ms-btn{ font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text-1); background: var(--surface); border: 1px solid var(--border-2); border-radius: 8px; padding: 6px 30px 6px 10px; min-width: 150px; max-width: 70vw; cursor: pointer; }
  .pc-filter select:focus-visible, .ms-btn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .ms{ position: relative; }
  .ms-btn{ position: relative; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 200px; }
  .ms-btn::after{ content:""; position:absolute; right: 12px; top: 50%; width: 6px; height: 6px; border-right: 2px solid var(--text-2); border-bottom: 2px solid var(--text-2); transform: translateY(-70%) rotate(45deg); }
  .ms.on .ms-btn{ border-color: var(--accent); background: var(--accent-wash); color: var(--accent-ink); }
  .ms-panel{ position:absolute; top: calc(100% + 6px); right: 0; z-index: 60; width: 340px; max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--border-2); border-radius: 10px; box-shadow: 0 12px 32px -10px rgba(16,18,15,0.32); padding: 8px; }
  .ms-search{ width: 100%; font-family: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--border-2); border-radius: 7px; color: var(--text-1); background: var(--surface); }
  .ms-search:focus-visible{ outline: 2px solid var(--accent); outline-offset: 1px; }
  .ms-tools{ display:flex; justify-content: space-between; align-items:center; margin: 6px 2px 4px; font-size: 11.5px; color: var(--text-mut); }
  .ms-tools button, .filter-clear{ appearance:none; border:none; background:none; font-family: inherit; font-size: 12px; font-weight: 700; color: var(--accent-ink); cursor:pointer; padding: 3px 4px; border-radius: 5px; }
  .ms-tools button:hover, .filter-clear:hover{ background: var(--accent-wash); }
  .ms-list{ max-height: 290px; overflow-y: auto; border-top: 1px solid var(--border); padding-top: 4px; }
  .ms-opt{ display:flex; align-items:center; gap: 9px; padding: 6px 6px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--text-1); cursor: pointer; line-height: 1.3; }
  .ms-opt:hover{ background: var(--surface-2); }
  .ms-opt input{ accent-color: var(--accent); margin: 0; flex: none; width: 15px; height: 15px; }
  .ms-empty{ font-size: 12.5px; color: var(--text-mut); padding: 10px 6px; margin: 0; }
  .filter-clear{ margin-left: auto; }
  @media (max-width: 560px){
    .filter-bar{ padding: 12px 14px; }
    .pc-filters{ width: 100%; }
    .pc-filter{ width: 100%; justify-content: space-between; }
    .pc-filter > span:first-child{ width: 62px; flex: none; }
    .pc-filter select, .ms-btn{ flex: 1 1 auto; min-width: 0; max-width: none; width: auto; }
    .ms-panel{ right: auto; left: 0; width: calc(100vw - 32px); }
    .filter-clear{ margin-left: 0; }
  }
  .cards-empty{ grid-column: 1 / -1; padding: 26px 22px; text-align:center; font-size: 13.5px; color: var(--text-mut); }
  main{ padding-bottom: 60px; }
</style>
</head><body>
<div class="portfolio-nav">
  <div class="nav-inner" id="nav-inner"></div>
</div>
<header class="portfolio-header">
  <div class="header-inner">
    <div class="header-titleblock">
      <p class="eyebrow">Dashboard executivo · PMO Datavale</p>
      <h1>Portfólio de Horas — Estimado × Realizado</h1>
      <p class="lede">Horas apontadas em todos os projetos ativos comparadas às estimadas. Selecione um projeto para abrir a dashboard detalhada.</p>
    </div>
    <div class="header-meta" id="header-meta"></div>
  </div>
</header>
<main>
  <div class="wrap" id="view-overview">
    <div class="card filter-bar" id="filter-bar">
      <div class="pc-filters"><label class="pc-filter" for="cliente-filter"><span>Cliente</span><select id="cliente-filter"><option value="">Todos</option></select></label><label class="pc-filter" for="status-filter"><span>Status</span><select id="status-filter"><option value="">Todos</option></select></label><label class="pc-filter" for="versao-filter"><span>Versão</span><select id="versao-filter"><option value="">Todas</option></select></label><div class="pc-filter ms" id="projeto-filter"><span id="projeto-filter-lbl">Projetos</span><button type="button" class="ms-btn" aria-haspopup="true" aria-expanded="false" aria-labelledby="projeto-filter-lbl"><span class="ms-txt">Todos</span></button><div class="ms-panel" tabindex="-1" hidden><input type="search" autocomplete="off" class="ms-search" placeholder="Buscar projeto…" aria-label="Buscar projeto"><div class="ms-tools"><span class="ms-count"></span><span><button type="button" data-ms="all">Marcar todos</button><button type="button" data-ms="none">Limpar</button></span></div><div class="ms-list" role="group" aria-label="Projetos"></div></div></div></div>
      <button type="button" class="filter-clear" id="filter-clear" hidden>Limpar filtros</button>
    </div>
    <div class="summary-grid">
      <div class="card sum-card span-2" id="card-hours"></div>
      <div class="card sum-card span-2" id="card-hours-solic"></div>
      <div class="card sum-card" id="card-colabs"></div>
      <div class="card sum-card" id="card-rw"></div>
    </div>
    <section class="block">
      <div class="block-head">
        <h2>Projetos</h2>
        <span class="hint" id="cards-hint">Clique em um projeto para abrir a dashboard detalhada</span>
      </div>
      <div class="cards-grid" id="cards-grid"></div>
    </section>

        var d = p.realizado - p.estimado, ww = Math.abs(d) / maxD * 50;

        val = '<span class="div-val tabular st-txt-' + p.status + '">' + signHM(d) + '</span>';
      } else {
        bar = '<span class="div-na">' + cfg.semLbl + '</span>';
        val = '<span class="div-val tabular" style="color:var(--text-mut)">—</span>';
      }
      return '<div class="div-row" data-slug="' + p.slug + '" title="' + projName(p) + ': realizado ' + fmtHM(p.realizado) + (p.estimado ? ' / estimado ' + fmtHM(p.estimado) : '') + '">'
        + '<span class="div-name">' + projName(p) + '</span><div class="div-track">' + bar + '</div>' + val + '</div>';
    }).join('');
    var right = '<div class="hrs-right"><p class="sum-sub">' + cfg.diffTitle + '</p>' + rows
      + '<div class="div-axis"><span></span><div><span>← abaixo do estimado</span><span>acima →</span></div><span></span></div></div>';
    document.getElementById(cfg.id).innerHTML = '<div class="sum-head"><h2 class="sum-title">' + cfg.title + '</h2><span class="sum-hint">' + (filt ? escapeHtml(filt) : cfg.base) + ' · clique em um projeto para abrir</span></div>'
      + '<div class="hrs-grid">' + left + right + '</div>';
  }
  function solicPortfolio(P){
    var dev = 0, tst = 0;
    var projs = P.projetos.map(function(p){
      var E = (PROJECTS[p.slug] && PROJECTS[p.slug].estSolic) || {}, d = 0, t = 0;
      Object.keys(E).forEach(function(k){ d += Number(E[k][0]) || 0; t += Number(E[k][1]) || 0; });
      dev += d; tst += t;
      var es = d + t;
      return { slug: p.slug, nome: p.nome, realizado: p.realizado, estimado: es, status: es ? statusOf(p.realizado, es) : 'neutral' };
    });
    var com = projs.filter(function(p){ return p.estimado; });
    return { totalRealizado: P.totalRealizado, totalEstimado: dev + tst, nProjetos: projs.length, nProjetosComEst: com.length,
             totalRealizadoComEst: com.reduce(function(a, p){ return a + p.realizado; }, 0), projetos: projs,
             estDetail: 'Dev ' + fmtHM(dev) + ' + Teste ' + fmtHM(tst) };
  }
  function renderColabs(P, filt){
    var S = P.setores || [], tot = P.totalRealizado || 0;
    var maxH = S.reduce(function(m, s){ return Math.max(m, s.horas); }, 0) || 1;
    var maxC = S.reduce(function(m, s){ return Math.max(m, s.nColaboradores); }, 0) || 1;
    var rows = S.map(function(s){
      var c = setorColor(s.nome);
      return '<div class="set-row">'
        + '<span class="set-name"><span class="dot" style="background:' + c + '"></span>' + escapeHtml(s.nome) + '</span>'
        + '<div class="set-bars">'
        +   '<div class="set-track" title="Horas: ' + fmtHM(s.horas) + '"><div style="width:' + Math.max(3, s.horas / maxH * 100) + '%;background:' + c + '"></div></div>'
        +   '<div class="set-track" title="Colaboradores: ' + s.nColaboradores + '"><div style="width:' + Math.max(3, s.nColaboradores / maxC * 100) + '%;background:' + c + ';opacity:.4"></div></div>'
        + '</div>'
        + '<span class="set-val tabular"><b>' + fmtHM(s.horas) + ' · ' + fmtInt(s.nColaboradores) + (s.nColaboradores === 1 ? ' colab.' : ' colabs.') + '</b><span>' + fmtPct(tot ? s.horas / tot * 100 : 0) + ' das horas</span></span>'
        + '</div>';
    }).join('');
    document.getElementById('card-colabs').innerHTML = '<div class="sum-head"><h2 class="sum-title">Colaboradores Envolvidos</h2><span class="sum-hint">por setor · horas e colaboradores' + (filt ? ' · projetos filtrados' : '') + '</span></div>'
      + '<div class="sum-big"><span class="num-hero tabular">' + fmtInt(P.nColaboradores) + '</span><span class="sum-big-label">colaboradores distintos apontaram ' + fmtHM(tot) + ' no período</span></div>'
      + '<div class="mini-legend" style="margin:0 0 6px"><span><span class="sq" style="background:var(--cat-1)"></span>Horas realizadas</span><span><span class="sq" style="background:var(--cat-1);opacity:.4"></span>Nº de colaboradores</span></div>'
      + rows
      + '<p class="note-sm">Um colaborador que apontou em mais de um setor é contado em cada setor; o total acima conta cada pessoa uma vez.</p>';
  }
  function renderRw(P, filt){
    var R = P.retrabalho || { total: 0, horasImpacto: 0, nSolic: 0, projetos: [] };
    var el = document.getElementById('card-rw'), tot = P.totalRealizado || 0;
    var head = '<div class="sum-head"><h2 class="sum-title">Retrabalho: Teste → Desenvolvimento</h2><span class="sum-hint">' + (filt ? 'projetos filtrados' : 'todos os projetos') + '</span></div>';
    if (!R.total){ el.innerHTML = head + '<p class="note-sm">Nenhum retorno identificado entre Teste e Desenvolvimento ' + (filt ? 'nos projetos filtrados.' : 'no portfólio.') + '</p>'; return; }
    var pct = tot ? R.horasImpacto / tot * 100 : 0;
    var maxH = R.projetos.reduce(function(m, p){ return Math.max(m, p.horas); }, 0) || 1;
    var rows = R.projetos.map(function(p){
      return '<div class="rwp-row" data-slug="' + p.slug + '" title="' + projName(p) + ': ' + fmtHM(p.horas) + ' em ' + p.total + ' retorno(s) — ' + fmtPct(p.realizado ? p.horas / p.realizado * 100 : 0) + ' das horas do projeto">'
        + '<span class="div-name">' + projName(p) + '</span>'
        + '<div class="rwp-track"><div style="width:' + Math.max(3, p.horas / maxH * 100) + '%"></div></div>'
        + '<span class="rwp-val tabular">' + fmtHM(p.horas) + ' <span>· ' + fmtInt(p.total) + ' ret.</span></span></div>';
    }).join('');
    el.innerHTML = head
      + '<div class="rw-top">' + pieSvg(tot ? R.horasImpacto / tot : 0)
      + '<div><div class="rw-num tabular">' + fmtHM(R.horasImpacto) + '</div>'
      + '<div class="rw-txt">desperdiçadas em <b>' + fmtInt(R.total) + ' retorno(s)</b> de ' + fmtInt(R.nSolic) + ' solicitação(ões) — <b style="color:var(--critical)">' + fmtPct(pct) + '</b> das ' + fmtHM(tot) + ' realizadas ' + (filt ? 'nos projetos filtrados' : 'no portfólio') + '</div></div></div>'
      + '<p class="sum-sub">Horas desperdiçadas por projeto</p>' + rows;
  }
  function buildPortfolio(slugs){
    var on = {}; slugs.forEach(function(s){ on[s] = 1; });
    var projs = PORTFOLIO.projetos.filter(function(p){ return on[p.slug]; });
    var P = { totalRealizado: 0, totalEstimado: 0, totalRealizadoComEst: 0, nProjetos: projs.length, nProjetosComEst: 0,
              nColaboradores: 0, setores: [], retrabalho: { total: 0, horasImpacto: 0, nSolic: 0, projetos: [] }, projetos: projs };
    var colabs = {}, setores = {};
    projs.forEach(function(p){
      P.totalRealizado += p.realizado; P.totalEstimado += p.estimado;
      if (p.estimado){ P.totalRealizadoComEst += p.realizado; P.nProjetosComEst++; }
      var raw = PROJECTS[p.slug] || {};
      (raw.recs || []).forEach(function(r){
        var nome = String(r[0] == null || r[0] === '' ? '—' : r[0]).trim();
        var s = setores[nome] = setores[nome] || { nome: nome, horas: 0, c: {} };
        s.horas += r[5]; s.c[r[1]] = 1; colabs[r[1]] = 1;
      });
      var rw = raw.retrabalho || { total: 0, horasImpactoTotal: 0, itens: [] };
      P.retrabalho.total += rw.total; P.retrabalho.horasImpacto += rw.horasImpactoTotal; P.retrabalho.nSolic += (rw.itens || []).length;
      if (rw.total) P.retrabalho.projetos.push({ slug: p.slug, nome: p.nome, total: rw.total, horas: rw.horasImpactoTotal, realizado: p.realizado });
    });
    P.nColaboradores = Object.keys(colabs).length;
    P.setores = Object.keys(setores).map(function(k){ var s = setores[k]; return { nome: s.nome, horas: s.horas, nColaboradores: Object.keys(s.c).length }; })
      .sort(function(a, b){ return b.horas - a.horas; });
    P.retrabalho.projetos.sort(function(a, b){ return b.horas - a.horas; });
    return P;
  }
  function renderSummary(P, filt){
    if (!P.nProjetos){
      var msg = '<p class="note-sm">Nenhum projeto com os filtros selecionados.</p>';
      document.getElementById('card-hours').innerHTML = '<div class="sum-head"><h2 class="sum-title">Horas Estimadas × Realizadas</h2><span class="sum-hint">' + escapeHtml(filt) + '</span></div>' + msg;
      document.getElementById('card-hours-solic').innerHTML = '<div class="sum-head"><h2 class="sum-title">' + SOLIC_CFG.title + '</h2></div>' + msg;
      document.getElementById('card-colabs').innerHTML = '<div class="sum-head"><h2 class="sum-title">Colaboradores Envolvidos</h2></div>' + msg;
      document.getElementById('card-rw').innerHTML = '<div class="sum-head"><h2 class="sum-title">Retrabalho: Teste → Desenvolvimento</h2></div>' + msg;
      return;
    }
    renderHours(P, filt); renderHours(solicPortfolio(P), filt, SOLIC_CFG); renderColabs(P, filt); renderRw(P, filt);
  }
  renderSummary(PORTFOLIO, '');
  var navHtml = '<button type="button" class="nav-btn active" data-slug="overview">Visão Geral</button>';
  PORTFOLIO.projetos.forEach(function(p){
    navHtml += '<button type="button" class="nav-btn" data-slug="' + p.slug + '">' + escapeHtml(toTitleCase(p.nome)) + '</button>';
  });
  document.getElementById('nav-inner').innerHTML = navHtml;
  document.getElementById('nav-inner').addEventListener('click', function(e){
    var btn = e.target.closest('.nav-btn');
    if (!btn) return;
    var slug = btn.getAttribute('data-slug');
    if (slug === 'overview') backToPortfolio(); else loadProject(slug);
  });
  function atendHtml(slug){
    var A = (PROJECTS[slug] && PROJECTS[slug].atendimentos) || [];
    if (!A.length) return '<span class="na">Atendimento não informado</span>';
    return A.map(function(a){
      return '<span title="Status do atendimento ' + escapeHtml(a.num) + '">Atendimento ' + escapeHtml(a.num) + ' - '
        + (a.status ? escapeHtml(a.status) : '<i class="na">Status não informado</i>') + '</span>';
    }).join('');
  }
  function versHtml(slug){
    var V = (PROJECTS[slug] && PROJECTS[slug].versoes) || [];
    return V.length ? '<span title="Versões liberadas">' + (V.length > 1 ? 'Versões: ' : 'Versão: ') + escapeHtml(V.join(' - ')) + '</span>' : '';
  }
  document.getElementById('cards-grid').innerHTML = PORTFOLIO.projetos.map(function(p){
    var statusColor = STATUS_COLOR_VAR[p.status];
    var E = (PROJECTS[p.slug] && PROJECTS[p.slug].estSolic) || {}, es = 0;
    Object.keys(E).forEach(function(k){ es += (Number(E[k][0]) || 0) + (Number(E[k][1]) || 0); });
    var maxBar = Math.max(p.estimado, es, p.realizado) || 1;
    var pcRow = function(lbl, v, color, title){
      return '<div class="pc-row" title="' + title + '">'
        + '<span class="pc-row-label">' + lbl + '</span>'
        + '<div class="pc-track">' + (v ? '<div class="pc-fill" style="width:' + Math.max(3, v / maxBar * 100) + '%; background:' + color + '"></div>' : '') + '</div>'
        + '<span class="pc-val tabular">' + (v ? fmtHM(v) : '—') + '</span>'
        + '</div>';
    };
    var estRow = pcRow('Estimado', p.estimado, 'var(--neutral-bar)', 'Estimado do projeto (HORASESTIMADAS)')
      + pcRow('Est. solic.', es, 'var(--est-solic)', 'Estimado por solicitação: Σ previsto de Desenvolvimento + Teste')
      + pcRow('Realizado', p.realizado, statusColor, 'Horas apontadas');
    var cons = function(est, lbl, sem){
      if (!est) return '<span class="na">' + sem + '</span>';
      var st = statusOf(p.realizado, est);
      return '<span><b class="st-txt-' + st + '">' + fmtPct(p.realizado / est * 100) + '</b> do ' + lbl + ' consumido</span>';
    };
    var note = cons(p.estimado, 'estimado do projeto', 'Sem estimado do projeto')
      + cons(es, 'estimado por solicitação', 'Sem estimado por solicitação');
    return '<div class="card project-card" data-slug="' + p.slug + '">'
      + '<div class="pc-header"><span class="pc-header-title">' + escapeHtml(toTitleCase(p.nome)) + '</span></div>'
      + '<div class="pc-body">'
      +   '<div class="pc-status-row"><span class="status-badge st-' + p.status + '">' + STATUS_LABEL[p.status] + '</span></div>'
      +   '<div class="pc-bars">' + estRow + '</div>'
      +   '<span class="pc-note">' + note + '</span>'
      +   '<div class="pc-foot">'
      +     '<span class="pc-meta pc-atend">' + atendHtml(p.slug) + '</span>'
      +     '<span class="pc-meta pc-vers">' + versHtml(p.slug) + '</span>'
      +     '<button type="button" class="pc-cta" data-slug="' + p.slug + '">Ver dashboard →</button>'
      +   '</div>'
      + '</div>'
      + '</div>';
  }).join('');
  (function(){
    var NA = '__na__', grid = document.getElementById('cards-grid');
    var selS = document.getElementById('status-filter'), selV = document.getElementById('versao-filter'), selC = document.getElementById('cliente-filter');
    var ms = document.getElementById('projeto-filter'), msBtn = ms.querySelector('.ms-btn'), msTxt = ms.querySelector('.ms-txt');
    var msPanel = ms.querySelector('.ms-panel'), msList = ms.querySelector('.ms-list'), msSearch = ms.querySelector('.ms-search'), msCount = ms.querySelector('.ms-count');
    var clearBtn = document.getElementById('filter-clear');
    var selP = {};
    var cliOf = function(slug){
      var nome = String((PROJECTS[slug] && PROJECTS[slug].projeto) || ''), m = nome.split(/\s+-\s+/);
      return m.length > 1 && m[0].trim() ? [toTitleCase(m[0].trim())] : [NA];
    };
    var stsOf = function(slug){
      var A = (PROJECTS[slug] && PROJECTS[slug].atendimentos) || [];
      return A.length ? A.map(function(a){ return a.status || NA; }) : [NA];
    };
    var versOf = function(slug){
      var V = (PROJECTS[slug] && PROJECTS[slug].versoes) || [];
      return V.length ? V : [NA];
    };
    var vKey = function(v){ return (v.match(/\d+/g) || []).map(Number); };
    var vCmp = function(a, b){
      var x = vKey(a), y = vKey(b);
      if (!x.length || !y.length) return (!x.length) - (!y.length) || a.localeCompare(b, 'pt-BR');
      for (var i = 0; i < Math.min(x.length, y.length); i++) if (x[i] !== y[i]) return x[i] - y[i];
      return x.length - y.length || a.localeCompare(b, 'pt-BR');
    };
    function fill(sel, getter, cmp, naLabel, pool){
      var keep = sel.value, opts = {};
      while (sel.options.length > 1) sel.remove(1);
      (pool || PORTFOLIO.projetos).forEach(function(p){
        var seen = {};
        getter(p.slug).forEach(function(v){ if (!seen[v]){ seen[v] = 1; opts[v] = (opts[v] || 0) + 1; } });
      });
      Object.keys(opts).filter(function(v){ return v !== NA; }).sort(cmp)
        .concat(opts[NA] ? [NA] : []).forEach(function(v){
          var o = document.createElement('option');
          o.value = v; o.textContent = (v === NA ? naLabel : v) + ' (' + opts[v] + ')';
          sel.appendChild(o);
        });
      sel.value = keep && opts[keep] ? keep : '';
    }
    var okC = function(p){ return !selC.value || cliOf(p.slug).indexOf(selC.value) !== -1; };
    var okS = function(p){ return !selS.value || stsOf(p.slug).indexOf(selS.value) !== -1; };
    var okV = function(p){ return !selV.value || versOf(p.slug).indexOf(selV.value) !== -1; };
    var nomeDe = function(slug){ for (var i = 0; i < PORTFOLIO.projetos.length; i++) if (PORTFOLIO.projetos[i].slug === slug) return toTitleCase(PORTFOLIO.projetos[i].nome); return slug; };
    var poolP = [];
    function fillProjects(){
      var inPool = {}; poolP.forEach(function(p){ inPool[p.slug] = 1; });
      Object.keys(selP).forEach(function(k){ if (!inPool[k]) delete selP[k]; });
      msList.innerHTML = poolP.length ? poolP.map(function(p){
        return '<label class="ms-opt" data-name="' + escapeHtml(normTxt(p.nome)) + '"><input type="checkbox" value="' + p.slug + '"' + (selP[p.slug] ? ' checked' : '') + '><span>' + escapeHtml(toTitleCase(p.nome)) + '</span></label>';
      }).join('') : '<p class="ms-empty">Nenhum projeto com os filtros selecionados.</p>';
      filterList(); syncMs();
    }
    function filterList(){
      var q = normTxt(msSearch.value);
      msList.querySelectorAll('.ms-opt').forEach(function(o){ o.style.display = !q || o.getAttribute('data-name').indexOf(q) !== -1 ? '' : 'none'; });
    }
    function syncMs(){
      var k = Object.keys(selP), n = k.length;
      msTxt.textContent = !n ? 'Todos' : (n === 1 ? nomeDe(k[0]) : n + ' projetos');
      msBtn.title = n ? k.map(nomeDe).join('\n') : 'Todos os projetos';
      msCount.textContent = n + ' de ' + poolP.length + ' marcado(s)';
      ms.classList.toggle('on', n > 0);
    }
    function cascade(){
      fill(selS, stsOf, function(a, b){ return a.localeCompare(b, 'pt-BR'); }, 'Status não informado', PORTFOLIO.projetos.filter(okC));
      fill(selV, versOf, vCmp, 'Sem versão', PORTFOLIO.projetos.filter(function(p){ return okC(p) && okS(p); }));
      poolP = PORTFOLIO.projetos.filter(function(p){ return okC(p) && okS(p) && okV(p); });
      fillProjects();
    }
    fill(selC, cliOf, function(a, b){ return a.localeCompare(b, 'pt-BR'); }, 'Sem cliente');
    cascade();
    var empty = document.createElement('div');
    empty.className = 'cards-empty'; empty.textContent = 'Nenhum projeto com os filtros selecionados.'; empty.style.display = 'none';
    grid.appendChild(empty);
    function apply(fromMs){
      if (fromMs) syncMs(); else cascade();
      var vc = selC.value, vs = selS.value, vv = selV.value, nP = Object.keys(selP).length, n = 0, vis = [];
      var okSet = {}; poolP.forEach(function(p){ if (!nP || selP[p.slug]) okSet[p.slug] = 1; });
      grid.querySelectorAll('.project-card').forEach(function(c){
        var slug = c.getAttribute('data-slug'), ok = !!okSet[slug];
        c.style.display = ok ? '' : 'none'; if (ok){ n++; vis.push(slug); }
      });
      empty.style.display = n ? 'none' : '';
      var active = !!(vc || vs || vv || nP);
      clearBtn.hidden = !active;
      if (!active){ renderSummary(PORTFOLIO, ''); return; }
      var lab = [], txt = function(sel){ return sel.options[sel.selectedIndex].textContent.replace(/\s*\(\d+\)$/, ''); };
      if (vc) lab.push('Cliente: ' + txt(selC));
      if (vs) lab.push('Status: ' + txt(selS));
      if (vv) lab.push('Versão: ' + txt(selV));
      if (nP) lab.push('Projetos: ' + (nP === 1 ? nomeDe(Object.keys(selP)[0]) : nP + ' selecionados'));
      renderSummary(buildPortfolio(vis), 'Filtrado — ' + lab.join(' · ') + ' (' + vis.length + ' de ' + PORTFOLIO.projetos.length + ' projetos)');
    }
    selC.addEventListener('change', function(){ apply(); });
    selS.addEventListener('change', function(){ apply(); });
    selV.addEventListener('change', function(){ apply(); });
    var openMs = function(open){
      msPanel.hidden = !open; msBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open){ msSearch.value = ''; filterList(); }
    };
    msBtn.addEventListener('click', function(){ openMs(msPanel.hidden); });
    ms.addEventListener('focusout', function(e){ if (!msPanel.hidden && !ms.contains(e.relatedTarget)) openMs(false); });
    ms.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !msPanel.hidden) openMs(false); });
    msSearch.addEventListener('input', filterList);
    msList.addEventListener('change', function(e){
      var cb = e.target; if (!cb || cb.type !== 'checkbox') return;
      if (cb.checked) selP[cb.value] = 1; else delete selP[cb.value];
      apply(true);
    });
    ms.querySelector('.ms-tools').addEventListener('click', function(e){
      var b = e.target.closest('[data-ms]'); if (!b) return;
      var all = b.getAttribute('data-ms') === 'all';
      msList.querySelectorAll('.ms-opt').forEach(function(o){
        if (all && o.style.display === 'none') return;
        var cb = o.querySelector('input'); cb.checked = all;
        if (all) selP[cb.value] = 1; else delete selP[cb.value];
      });
      apply(true);
    });
    clearBtn.addEventListener('click', function(){
      selC.value = ''; selS.value = ''; selV.value = ''; selP = {};
      apply();
    });
  })();
  document.querySelector('.summary-grid').addEventListener('click', function(e){
    var row = e.target.closest('[data-slug]');
    if (row) loadProject(row.getAttribute('data-slug'));
  });
  document.getElementById('cards-grid').addEventListener('click', function(e){
    var card = e.target.closest('.project-card');
    if (card) loadProject(card.getAttribute('data-slug'));
  });
  var projectView = document.getElementById('project-view');
  var projectRoot = document.getElementById('project-root');
  var currentSlug = null;
  projectView.addEventListener('click', function(e){
    if (e.target.closest('[data-action="back"]')) backToPortfolio();
  });
  function setActiveNav(slug){
    document.querySelectorAll('.nav-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-slug') === slug);
    });
  }
  window.loadProject = function(slug){
    if (!PROJECTS[slug]) return;
    document.getElementById('view-overview').style.display = 'none';
    projectView.style.display = 'block';
    if (currentSlug !== slug){
      window.renderProject(PROJECTS[slug], projectRoot);
      currentSlug = slug;
    }
    setActiveNav(slug);
    window.scrollTo(0, 0);
  };
  window.backToPortfolio = function(){
    projectView.style.display = 'none';
    document.getElementById('view-overview').style.display = 'block';
    setActiveNav('overview');
    window.scrollTo(0, 0);
  };
})();
</script>
